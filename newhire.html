   NEW HIRE PROGRAM
   Four parts for a rep's first weeks:
     Today      — the morning checklist, done fresh every day
     Daily Log  — reviews, doors, takeaways, what to work on
     Training   — the week-by-week plan for their role, checked off
     Welcome    — what we expect, uniforms, how the program works
   Plus a PIN-gated Manager tab that shows every new hire at a glance.

   Data lives under  newHire/<personId>/  in Firebase:
     profile   {track, startDate}
     checklist/<YYYY-MM-DD>/<itemKey>   true | text   (+ _doneAt)
     log/<YYYY-MM-DD>   {reviews, doors, calls, takeaways, workOn, win, questions, confidence}
     training/<itemKey>   timestamp it was checked off

   Renaming a checklist/training line un-checks it for everyone

const today=()=>dk(new Date());
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const nice=k=>new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const slug=t=>String(t).toLowerCase().replace(/^\*/,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,70);
const $=id=>document.getElementById(id);
const base=()=>`newHire/${viewing}`;

db.ref('salespeople').on('value',s=>{people=s.val()||{};paintHeader();if(tab==='mgr')render();});
function listen(){
    if(ref){try{ref.off();}catch(e){}}
    ref=db.ref(base());
    ref.on('value',s=>{data=s.val()||{};if(tab===null)tab=(data.profile&&data.profile.track)?'today':'welcome';if(typing())return;render();});
}
function typing(){const el=document.activeElement;return !!(el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&el.type!=='checkbox'))&&el.closest&&el.closest('#nhBody'));}
document.addEventListener('blur',e=>{if(e.target&&e.target.closest&&e.target.closest('#nhBody'))setTimeout(()=>{if(!typing())render();},180);},true);
listen();

function paintHeader(){
    const p=people[viewing];
    $('personName').textContent=p?('Program for: '+p.name):'';
    $('nhViewing').innerHTML=(viewing!==me)?`<div class="nh-view"><span>Manager view — you are looking at <b>${esc(p?p.name:'this rep')}</b>. Changes you make here save to their program.</span><button class="btn" onclick="viewPerson('${me}')">Back to mine</button></div>`:'';
}
function viewPerson(id){viewing=id;data={};logDate=null;openWeeks={};tab=(id===me)?'today':'today';paintHeader();listen();}
function setTab(t){tab=t;if(t==='mgr')loadAll();render();window.scrollTo({top:0});}

/* ───────────── helpers on the data ───────────── */
function track(){const k=data.profile&&data.profile.track;return TRACKS[k]?k:null;}
function allItems(tk){const out=[];TRACKS[tk].weeks.forEach((w,wi)=>w[1].forEach(it=>{const pr=it.split(' || ');out.push({wi,key:tk+'_'+slug(pr[0]),text:pr[0].replace(/^\*/,''),detail:pr[1]||'',star:it.charAt(0)==='*'});}));return out;}
function trainingPct(d,tk){if(!tk)return 0;const it=allItems(tk),tr=(d&&d.training)||{};return it.length?Math.round(it.filter(x=>tr[x.key]).length/it.length*100):0;}
function weekNow(d){const s=d&&d.profile&&d.profile.startDate;if(!s)return null;const diff=Math.floor((new Date(today()+'T12:00:00')-new Date(s+'T12:00:00'))/864e5);return diff<0?0:Math.floor(diff/7)+1;}
function checkCount(day){day=day||{};return CHECKLIST.filter(c=>c.type==='text'?String(day[c.k]||'').trim():day[c.k]===true).length;}
function streak(d){const cl=(d&&d.checklist)||{};let n=0;const t=new Date();
    for(let i=0;i<120;i++){const x=new Date(t);x.setDate(t.getDate()-i);if(x.getDay()===0)continue;const day=cl[dk(x)];
        if(day&&day._doneAt)n++;else if(i===0)continue;else break;}
    return n;}
function last7(d){const lg=(d&&d.log)||{};let r=0,dr=0,days=0;const t=new Date();for(let i=0;i<7;i++){const x=new Date(t);x.setDate(t.getDate()-i);const e=lg[dk(x)];if(e){days++;r+=+e.reviews||0;dr+=+e.doors||0;}}return{r,dr,days};}

/* ───────────── render ───────────── */
function render(){
    const tabs=[['today','Today'],['log','Daily Log'],['plan','Training Plan'],['welcome','Welcome']];
    tabs.push(['mgr',isMgr?'Manager':'Manager 🔒']);
    $('nhTabs').innerHTML=tabs.map(t=>`<button class="nh-tab ${tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('');
    const tk=track();
    if(!tk&&tab!=='welcome'&&tab!=='mgr'){$('nhBody').innerHTML=enrollCard(true);return;}
    $('nhBody').innerHTML=tab==='today'?vToday():tab==='log'?vLog():tab==='plan'?vPlan():tab==='mgr'?vMgr():vWelcome();
}

function enrollCard(first){
    const p=data.profile||{};
    return `<div class="card"><div class="sec-label">${first?'Start your program':'Your program'}</div>
        ${first?'<p class="nh-sub" style="margin:0 0 14px">Pick the role you were hired for and your first day. This sets up your training plan.</p>':''}
        <div class="nh-g2"><div class="field"><label>Role</label><select id="enTrack">${Object.keys(TRACKS).map(k=>`<option value="${k}" ${p.track===k?'selected':''}>${TRACKS[k].name}</option>`).join('')}</select></div>
        <div class="field"><label>First day</label><input type="date" id="enStart" value="${p.startDate||today()}"></div></div>
        <button class="btn btn-red" onclick="saveProfile()">${first?'Start my program':'Save'}</button></div>`;
}
function saveProfile(){const t=$('enTrack').value,s=$('enStart').value||today();db.ref(base()+'/profile').update({track:t,startDate:s}).then(()=>{if(tab!=='welcome')return;tab='today';render();});}

/* ── TODAY: morning checklist ── */
function vToday(){
    const t=today(),now=new Date(),day=(data.checklist&&data.checklist[t])||{},n=checkCount(day),tot=CHECKLIST.length,done=n===tot,uni=UNIFORM[now.getDay()];
    const doneAt=day._doneAt?new Date(day._doneAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
    let h=`<div class="nh-hero"><div class="nh-eyebrow">${now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
        <div class="nh-big">${done?'Morning checklist <em>done</em>':`Morning checklist <em>${n}</em> of ${tot}`}</div>
        <div class="nh-sub">${done?('Finished at '+doneAt+'. Go have a great day.'):'Do this every morning before your first call.'}${uni?` Today's uniform: <b style="color:var(--text)">${uni}</b>.`:''}</div>
        <div class="nh-bar ${done?'ok':''}"><div style="width:${Math.round(n/tot*100)}%"></div></div>
        <div class="nh-stats"><div class="nh-stat"><b>${streak(data)}</b><span>Day streak</span></div><div class="nh-stat"><b>${weekNow(data)||'—'}</b><span>Week</span></div><div class="nh-stat"><b>${trainingPct(data,track())}%</b><span>Training done</span></div></div></div>`;
    h+='<div class="card"><div class="sec-label">Every morning</div>';
    CHECKLIST.forEach(c=>{
        if(c.type==='text'){const v=String(day[c.k]||'');h+=`<div class="nh-textitem ${v.trim()?'filled':''}"><label>${esc(c.t)}</label><input type="text" value="${esc(v)}" placeholder="${esc(c.ph||'')}" onchange="setCheck('${c.k}',this.value)"></div>`;}
        else{const sub=c.sub==='uniform'?(uni?('Today: '+uni):'No uniform day listed for Sunday'):(c.sub||'');
            h+=`<label class="check-row"><input type="checkbox" ${day[c.k]===true?'checked':''} onchange="setCheck('${c.k}',this.checked)"><span class="ct">${esc(c.t)}${sub?`<span class="cs">${esc(sub)}</span>`:''}</span></label>`;}
    });
    h+='</div>';
    const lg=(data.log&&data.log[t]);
    h+=`<div class="card"><div class="sec-label">End of day</div><p class="nh-sub" style="margin:0 0 12px">${lg?'You started today\'s log. Finish it before you head home.':'Before you head home, fill in today\'s log: reviews, doors, what you learned.'}</p><button class="btn btn-red" onclick="logDate=null;setTab('log')">${lg?'Finish today\'s log':'Fill in today\'s log'}</button></div>`;
    return h;
}
function setCheck(k,v){
    const t=today(),day=Object.assign({},(data.checklist&&data.checklist[t])||{});
    if(v===false||v==='')delete day[k];else day[k]=(typeof v==='string')?v.trim():true;
    const up={};up[k]=(k in day)?day[k]:null;
    const full=checkCount(day)===CHECKLIST.length;
    if(full&&!day._doneAt)up._doneAt=Date.now();
    if(!full&&day._doneAt)up._doneAt=null;
    db.ref(`${base()}/checklist/${t}`).update(up);
}

/* ── DAILY LOG ── */
function vLog(){
    const d=logDate||today(),e=(data.log&&data.log[d])||{},w=last7(data);
    const num=(k,l)=>`<div class="field"><label>${l}</label><input type="number" inputmode="numeric" min="0" value="${e[k]!=null?e[k]:''}" placeholder="0" onchange="setLog('${k}',this.value===''?null:Math.max(0,parseInt(this.value)||0))"></div>`;
    const txt=(k,l,ph)=>`<div class="field"><label>${l}</label><textarea placeholder="${ph}" onchange="setLog('${k}',this.value.trim()||null)">${esc(e[k]||'')}</textarea></div>`;
    let h=`<div class="nh-hero"><div class="nh-eyebrow">Last 7 days</div><div class="nh-stats" style="margin-top:8px"><div class="nh-stat"><b>${w.r}</b><span>Reviews</span></div><div class="nh-stat"><b>${w.dr}</b><span>Doors knocked</span></div><div class="nh-stat"><b>${w.days}</b><span>Days logged</span></div></div></div>`;
    h+=`<div class="card"><div class="sec-label">Log for ${d===today()?'today':nice(d)} <span class="nh-saved" id="nhSaved">Saved ✓</span></div>
        <div class="field"><label>Day</label><input type="date" value="${d}" max="${today()}" onchange="logDate=this.value||null;render()"></div>
        <div class="nh-g3">${num('reviews','Reviews')}${num('doors','Doors knocked')}${num('calls','Calls ran / rode')}</div>
        ${txt('takeaways','Key takeaways — what did you learn today?','The two or three things you want to remember')}
        ${txt('workOn','What do you need to work on?','Be honest — this is how your trainer knows where to help')}
        ${txt('win','Win of the day','Something that went right')}
        ${txt('questions','Questions for your trainer','Anything you were not sure about')}
        <div class="field" style="margin-bottom:0"><label>How confident did you feel today? (1 = lost, 5 = could do it alone)</label><div class="nh-conf">${[1,2,3,4,5].map(i=>`<button type="button" class="${+e.confidence===i?'on':''}" onclick="setLog('confidence',${+e.confidence===i?'null':i})">${i}</button>`).join('')}</div></div></div>`;
    const keys=Object.keys(data.log||{}).sort().reverse().slice(0,30);
    h+='<div class="card"><div class="sec-label">Past logs</div>'+(keys.length?keys.map(k=>{const x=data.log[k];
        return `<div class="nh-log" onclick="this.classList.toggle('open')"><div class="nh-log-top"><span class="nh-log-date">${nice(k)}</span><span class="nh-log-nums">${+x.reviews||0} reviews · ${+x.doors||0} doors${x.confidence?' · '+x.confidence+'/5':''}</span></div>
            <div class="nh-log-body">${x.takeaways?'<b>Takeaways</b>'+esc(x.takeaways):''}${x.workOn?'<b>Needs work</b>'+esc(x.workOn):''}${x.win?'<b>Win</b>'+esc(x.win):''}${x.questions?'<b>Questions</b>'+esc(x.questions):''}
            <div style="margin-top:10px"><button class="btn" onclick="event.stopPropagation();logDate='${k}';render();window.scrollTo({top:0})">Edit this day</button></div></div></div>`;}).join(''):'<p class="nh-sub" style="margin:0">No logs yet. Your first one goes in above.</p>')+'</div>';
    return h;
}
function setLog(k,v){const d=logDate||today(),up={};up[k]=v;up.updatedAt=Date.now();db.ref(`${base()}/log/${d}`).update(up).then(()=>{const s=$('nhSaved');if(s){s.classList.add('show');setTimeout(()=>s.classList.remove('show'),1400);}});}

/* ── TRAINING PLAN ── */
function vPlan(){
    const tk=track(),T=TRACKS[tk],tr=data.training||{},wn=weekNow(data),pct=trainingPct(data,tk),items=allItems(tk);
    const numbered=T.weeks.filter(w=>/^Week \d/.test(w[0])).length;
    let h=`<div class="nh-hero"><div class="nh-eyebrow">${esc(T.name)} training</div>
        <div class="nh-big">${wn?(numbered&&wn<=numbered?`Week <em>${wn}</em> of ${numbered}`:(numbered?'Past week '+numbered:'In progress')):'Not started'}</div>
        <div class="nh-sub">${items.filter(x=>tr[x.key]).length} of ${items.length} items checked off. Tick each one when your trainer has shown you and you have done it yourself.</div>
        <div class="nh-bar ${pct===100?'ok':''}"><div style="width:${pct}%"></div></div></div>`;
    T.weeks.forEach((w,wi)=>{
        const its=items.filter(x=>x.wi===wi),dn=its.filter(x=>tr[x.key]).length,isNow=/^Week \d/.test(w[0])&&wn===wi+1;
        const open=(wi in openWeeks)?openWeeks[wi]:(isNow||(!wn&&wi===0));
        h+=`<div class="nh-week ${isNow?'now':''} ${open?'open':''}"><div class="nh-week-h" onclick="openWeeks[${wi}]=!${open};render()"><div class="nh-week-n">${esc(w[0])}${isNow?'<small>THIS WEEK</small>':''}</div><div class="nh-week-c ${dn===its.length?'ok':''}">${dn===its.length?'✓ Done':dn+' / '+its.length}</div><div style="color:var(--muted);font-size:12px">${open?'▴':'▾'}</div></div>
            <div class="nh-week-b">${its.map(x=>`<label class="check-row ${x.star?'star':''}"><input type="checkbox" ${tr[x.key]?'checked':''} onchange="setTrain('${x.key}',this.checked)"><span class="ct">${esc(x.text)}${x.detail?`<span class="cs">${esc(x.detail)}</span>`:''}</span></label>`).join('')}</div></div>`;
    });
    if(tk==='sales')h+=`<div class="card"><p class="nh-sub" style="margin:0 0 12px">Practice your objection responses and word tracks in the Sales Academy.</p><a class="btn" href="training.html" style="text-decoration:none;display:inline-block">Open Sales Academy</a></div>`;
    return h;
}
function setTrain(k,v){db.ref(`${base()}/training/${k}`).set(v?Date.now():null);}

/* ── WELCOME ── */
function vWelcome(){
    const dow=new Date().getDay(),tk=track();
    let h=`<div class="nh-hero"><div class="nh-eyebrow">Welcome to the team</div><div class="nh-big">Your first <em>six weeks</em></div>
        <div class="nh-sub">This page is your program. Three habits make it work: do the <b style="color:var(--text)">morning checklist</b> before your first call, fill in your <b style="color:var(--text)">daily log</b> before you go home, and check off your <b style="color:var(--text)">training plan</b> as your trainer signs you off on each skill.</div></div>`;
    h+=enrollCard(!tk);
    h+='<div class="card"><div class="sec-label">What we expect</div>'+EXPECT.map(x=>`<div class="nh-exp"><h3>${x[0]}<span>${x[1]}</span></h3><ul>${x[2].map(li=>`<li>${esc(li)}</li>`).join('')}</ul></div>`).join('')+'</div>';
    h+=`<div class="card"><div class="sec-label">Dispatching out of a call</div><p class="nh-sub" style="margin:0 0 10px">Every time you finish a call, call or text the dispatch number and tell the office:</p>
        <div class="nh-exp"><ul style="margin-top:0">${DISPATCH.map(li=>`<li>${esc(li)}</li>`).join('')}</ul></div><p class="nh-sub" style="margin:0">Your trainer will give you the dispatch number.</p></div>`;
    h+=`<div class="card"><div class="sec-label">Uniforms</div><div class="nh-uni"><div class="${[1,3,5].includes(dow)?'today':''}"><b>Monday · Wednesday · Friday</b><span>Gray / Light Blue</span></div><div class="${[2,4,6].includes(dow)?'today':''}"><b>Tuesday · Thursday · Saturday</b><span>Khakis / Dark Blue</span></div></div>
        <p class="nh-sub" style="margin-top:12px">Be on time to every meeting, in uniform and ready to work.</p></div>`;
    return h;
}

/* ── MANAGER ── */
function loadAll(){if(!isMgr)return;db.ref('newHire').once('value').then(s=>{allNH=s.val()||{};if(tab==='mgr')render();});}
function vMgr(){
    if(!isMgr)return `<div class="card"><div class="sec-label">Manager view</div><p class="nh-sub" style="margin:0 0 14px">Enter the manager PIN to see every new hire's checklist, logs and training progress.</p>
        <div class="field"><label>Manager PIN</label><input type="password" id="nhPin" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')mgrUnlock()"></div><div id="nhPinMsg" class="bad" style="font-size:13px;margin-bottom:10px"></div><button class="btn btn-red" onclick="mgrUnlock()">Unlock</button></div>`;
    if(allNH===null)return '<div class="card"><p class="nh-sub" style="margin:0">Loading…</p></div>';
    const t=today(),rows=Object.keys(allNH).filter(id=>people[id]&&allNH[id].profile&&TRACKS[allNH[id].profile.track]).map(id=>{
        const d=allNH[id],tk=d.profile.track,day=(d.checklist&&d.checklist[t])||{},w=last7(d),lk=Object.keys(d.log||{}).sort().pop();
        return {id,name:people[id].name,tk,wk:weekNow(d),pct:trainingPct(d,tk),cn:checkCount(day),doneAt:day._doneAt,last:lk,w,st:streak(d)};
    }).sort((a,b)=>(a.name<b.name?-1:1));
    let h=`<div class="card"><div class="sec-label">New hires at this location <span style="color:var(--text)">${rows.length}</span></div>`;
    h+=rows.length?`<div class="nh-scroll"><table class="nh-tbl"><tr><th>Name</th><th>Role</th><th>Week</th><th>Training</th><th>Checklist today</th><th>Streak</th><th>Last log</th><th>7-day reviews</th><th>7-day doors</th></tr>${rows.map(r=>{
        const cl=r.doneAt?`<span class="ok">✓ ${new Date(r.doneAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span>`:`<span class="${r.cn?'warn':'bad'}">${r.cn} / ${CHECKLIST.length}</span>`;
        const ll=r.last?(r.last===t?'<span class="ok">Today</span>':`<span class="${r.last<dk(new Date(Date.now()-2*864e5))?'bad':'warn'}">${nice(r.last)}</span>`):'<span class="bad">Never</span>';
        return `<tr class="row" onclick="viewPerson('${r.id}')"><td><b>${esc(r.name)}</b></td><td>${esc(TRACKS[r.tk].name)}</td><td>${r.wk||'—'}</td><td>${r.pct}%</td><td>${cl}</td><td>${r.st}</td><td>${ll}</td><td>${r.w.r}</td><td>${r.w.dr}</td></tr>`;}).join('')}</table></div><p class="nh-sub" style="margin-top:12px">Tap a name to open their checklist, logs and training plan.</p>`
        :'<p class="nh-sub" style="margin:0">Nobody at this location has started a program yet.</p>';
    h+='</div>';
    const others=Object.keys(people).filter(id=>!(allNH[id]&&allNH[id].profile&&allNH[id].profile.track)).sort((a,b)=>people[a].name<people[b].name?-1:1);
    h+=`<div class="card"><div class="sec-label">Enroll someone</div><div class="nh-g3 nh-en"><div class="field"><label>Rep</label><select id="mgPerson">${others.map(id=>`<option value="${id}">${esc(people[id].name)}</option>`).join('')}</select></div>
        <div class="field"><label>Role</label><select id="mgTrack">${Object.keys(TRACKS).map(k=>`<option value="${k}">${TRACKS[k].name}</option>`).join('')}</select></div>
        <div class="field"><label>First day</label><input type="date" id="mgStart" value="${t}"></div></div><button class="btn btn-red" onclick="mgrEnroll()">Enroll</button>
        <p class="nh-sub" style="margin-top:12px">New hires can also enroll themselves the first time they open this page. The rep has to be added in the Manager portal first.</p></div>`;
    return h;
}
function mgrUnlock(){const v=$('nhPin').value.trim();db.ref('managerPin').once('value').then(s=>{if(v&&String(s.val())===v){isMgr=true;sessionStorage.setItem('nhMgr','1');loadAll();render();}else{$('nhPinMsg').textContent='That PIN is not right.';}});}
function mgrEnroll(){const id=$('mgPerson').value;if(!id)return;db.ref(`newHire/${id}/profile`).update({track:$('mgTrack').value,startDate:$('mgStart').value||today()}).then(loadAll);}

/* roll the checklist over if the app sits open past midnight */
let _day=today();setInterval(()=>{if(today()!==_day){_day=today();if(!typing())render();}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!typing())render();});
</script>

 <a class="abn-tab" href="index.html" data-p="index.html"><span class="abn-ico"><i class="ti ti-home"></i></span><span class="abn-lab">Home</span></a>

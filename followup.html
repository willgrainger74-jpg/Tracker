        .fu-pill{flex:none;font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--wire2);color:var(--muted);white-space:nowrap}

        .fu-pill.lost{color:var(--red);border-color:rgba(220,38,38,.45);background:rgba(220,38,38,.1)}

<script>
/* ══════════════════════════════════════════════════════════════
   FOLLOW-UP — the signed-in rep's unsold calls, organised by the
   follow-up date they set on the call card (calls.html):
     followUpDate (YYYY-MM-DD) · followUpReason · followUpDone
   Sections: due today → overdue → coming up → no date set →
   completed. Nothing is copied — every row IS the original call
   in callLogs, so marking done / rescheduling writes back to it.
   ══════════════════════════════════════════════════════════════ */
firebase.initializeApp({apiKey:"AIzaSyD9POKxbl9hSt2FNtzdv3RPVnAb0wWsNbU",authDomain:"action-sales-tracker.firebaseapp.com",databaseURL:"https://action-sales-tracker-default-rtdb.firebaseio.com",projectId:"action-sales-tracker",storageBucket:"action-sales-tracker.firebasestorage.app",messagingSenderId:"686455834332",appId:"1:686455834332:web:84e9b843f912522bbdd619"});
const db=firebase.database(),selected=localStorage.getItem('selectedPerson');
if(!selected)window.location.href='index.html';
let logs={},showAllOther=false,showDone=false;
const OTHER_DAYS=60;   // "no date set" list looks back this far unless Show Older is tapped
const pad=n=>String(n).padStart(2,'0');
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money=n=>'$'+Math.round(parseFloat(n)||0).toLocaleString();
const nice=k=>new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const OBJ={price:'Price too high',think:'Need to think',spouse:'Spouse approval',someone:'Have someone',quotes:'Multiple quotes',timing:'Not now',trust:'Trust/Reviews'};

db.ref('salespeople').on('value',snap=>{const d=snap.val()||{};const p=d[selected];if(p)document.getElementById('personName').textContent='Follow-ups for: '+p.name;});
db.ref('callLogs').on('value',snap=>{logs=snap.val()||{};if(typing())return;render();});
/* don't rebuild the list out from under an open date picker */
function typing(){const el=document.activeElement;return !!(el&&el.tagName==='INPUT'&&el.closest&&el.closest('#fuSections'));}
document.addEventListener('blur',e=>{if(e.target&&e.target.closest&&e.target.closest('#fuSections'))setTimeout(()=>{if(!typing())render();},160);},true);

function collect(){
    const out=[],pre=selected+'_';
    Object.keys(logs).forEach(key=>{
        if(key.indexOf(pre)!==0||key.length!==pre.length+10)return;
        const day=key.slice(-10),calls=logs[key]||{};
        Object.keys(calls).forEach(id=>{const c=calls[id];if(!c||c.jobSold)return;
            if(!c.customerName&&!c.customerPhone&&!c.followUpDate&&!c.leftEstimate&&!c.jobCancelled&&!c.couldntFinance)return; // blank card
            out.push({key,id,day,c});});
    });
    return out;
}
function status(c){
    if(c.couldntFinance)return{cls:'lost',txt:"Couldn't finance"+(parseFloat(c.financeLostAmount)?' · '+money(c.financeLostAmount):'')};
    if(c.leftEstimate)return{cls:'est',txt:'Estimate'+(parseFloat(c.estimateAmount)?' '+money(c.estimateAmount):'')};
    if(c.jobCancelled)return{cls:'lost',txt:'Cancelled'};
    return{cls:'',txt:'Not sold'};
}
function item(x,kind){
    const c=x.c,st=status(c),tel=String(c.customerPhone||'').replace(/[^0-9+]/g,'');
    const trades=[c.tradePlumbing&&'Plumbing',c.tradeHVAC&&'HVAC',c.tradeElectrical&&'Electrical',c.tradeCameras&&'Cameras'].filter(Boolean).join(' · ');
    const meta=['Call ran '+nice(x.day),c.jobNumber&&'Job #'+esc(c.jobNumber),trades,c.objection&&OBJ[c.objection]&&'Objection: '+OBJ[c.objection]].filter(Boolean).join(' · ');
    const due=kind==='late'?`<span style="color:#f59e0b">Was due ${nice(c.followUpDate)}</span> · `:kind==='soon'?`Due ${nice(c.followUpDate)} · `:'';
    const reason=c.followUpReason||(c.jobCancelled&&c.cancelReason)||'';
    const k=`'${x.key}','${x.id}'`;
    return `<div class="fu-item ${kind==='today'?'due':kind==='late'?'late':kind==='done'?'done':''}">
        <div class="fu-top"><div style="min-width:0"><div class="fu-name">${esc(c.customerName)||'No name on call'}</div><div class="fu-meta">${due}${meta}${c.customerPhone?' · '+esc(c.customerPhone):''}</div></div><span class="fu-pill ${st.cls}">${st.txt}</span></div>
        ${reason?`<div class="fu-reason"><b>${c.followUpReason?'Reason for follow-up':'Cancel reason'}</b>${esc(reason)}</div>`:''}
        <div class="fu-actions">
            ${tel?`<a class="fu-btn call" href="tel:${tel}"><i class="ti ti-phone"></i> Call</a>`:''}
            ${kind==='done'?`<button class="fu-btn" onclick="setDone(${k},false)">Reopen</button>`:`<button class="fu-btn ok" onclick="setDone(${k},true)"><i class="ti ti-check"></i> Done</button>`}
            ${kind==='done'?'':`<label class="fu-when">${c.followUpDate?'Move to':'Set date'} <input type="date" value="${c.followUpDate||''}" onchange="setDate(${k},this.value)"></label>`}
        </div>
    </div>`;
}
function section(title,list,kind,empty){
    if(!list.length&&!empty)return '';
    return `<div class="card"><div class="sec-label">${title} <span class="n">${list.length}</span></div>${list.length?list.map(x=>item(x,kind)).join(''):`<div class="fu-empty">${empty}</div>`}</div>`;
}
function render(){
    const now=new Date(),today=dk(now),all=collect();
    const open=all.filter(x=>!x.c.followUpDone);
    const due=open.filter(x=>x.c.followUpDate===today);
    const late=open.filter(x=>x.c.followUpDate&&x.c.followUpDate<today).sort((a,b)=>a.c.followUpDate<b.c.followUpDate?-1:1);
    const soon=open.filter(x=>x.c.followUpDate&&x.c.followUpDate>today).sort((a,b)=>a.c.followUpDate<b.c.followUpDate?-1:1);
    const cut=new Date(now);cut.setDate(cut.getDate()-OTHER_DAYS);const cutK=dk(cut);
    const otherAll=open.filter(x=>!x.c.followUpDate).sort((a,b)=>a.day<b.day?1:-1);
    const other=showAllOther?otherAll:otherAll.filter(x=>x.day>=cutK);
    const done=all.filter(x=>x.c.followUpDone).sort((a,b)=>(b.c.followUpDoneAt||0)-(a.c.followUpDoneAt||0));

    document.getElementById('fuDate').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    const n=due.length;
    document.getElementById('fuCount').innerHTML=n?`You have <em>${n}</em> follow-up${n===1?'':'s'} today`:'No follow-ups due today';
    document.getElementById('fuSub').textContent=[late.length&&late.length+' overdue',soon.length&&soon.length+' coming up',otherAll.length&&otherAll.length+' with no date set'].filter(Boolean).join(' · ')||'Set a follow-up date on any call you don\'t sell and it will show up here on that day.';

    let html='';
    html+=section("Today's Follow-Ups",due,'today',n?'':'Nothing scheduled for today.');
    html+=section('Overdue — still need a call',late,'late');
    html+=section('Coming Up',soon,'soon');
    html+=section('Other Customers to Follow Up With — no date set',other,'other',otherAll.length?'':'Every unsold call has a follow-up date.');
    if(otherAll.length>other.length)html+=`<button class="fu-more" onclick="showAllOther=true;render()">Show ${otherAll.length-other.length} older than ${OTHER_DAYS} days</button>`;
    if(done.length)html+=showDone?section('Completed',done.slice(0,50),'done'):`<button class="fu-more" onclick="showDone=true;render()">Show ${done.length} completed</button>`;
    document.getElementById('fuSections').innerHTML=html;
}
function setDone(key,id,v){db.ref(`callLogs/${key}/${id}`).update({followUpDone:v,followUpDoneAt:v?Date.now():null});}
function setDate(key,id,v){db.ref(`callLogs/${key}/${id}`).update({followUpDate:v||'',followUpDone:false});}
/* the list is keyed to today's date — if the app sits open past midnight, roll it over */
let _day=dk(new Date());setInterval(()=>{const t=dk(new Date());if(t!==_day){_day=t;if(!typing())render();}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!typing())render();});
</script>

<script>
(function(){
 var p=(location.pathname.split('/').pop()||'index.html');
 document.querySelectorAll('.abn-tab[data-p]').forEach(function(t){if(t.getAttribute('data-p')===p)t.classList.add('on');});
 var more=['followup.html','reports.html','money.html','competition.html','doors.html','gym.html','training.html','manager.html','action_workbook.html','team_workbook.html'];
